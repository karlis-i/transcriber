<html lang="en">
    <head>
        <meta charset="utf-8">

        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Music Transcriber & Trainer</title>
        <link
            href="./node_modules/bootstrap/dist/css/bootstrap.min.css"
            rel="stylesheet"
        >
        <!-- @todo move .css files to project root dir later -->
        <!-- <link href="./style.css" rel="stylesheet"> -->
        <style>

#audioFileInput {
    display: none;
}

#zoomview-container, #overview-container {
    width: 100%;
}
#overview-container {
    height: 60px;
    border-bottom: 1px solid #111111;
}
#zoomview-container {
    height: 320px;
}
#scrollbar-container {
  height: 16px;
  background-color: #ccc;
}

.channel-selector {
    letter-spacing: -0.25rem;
}
        </style>
    </head>

    <body>

        <!-- waveform -->
        <div>
            <div class="container-fluid" id="waveFormContainer">
                <div id="overview-container"></div>
                <div id="zoomview-container"></div>
                <div id="scrollbar-container"></div>
            </div>
        </div>


        <!-- transport -->
        <div>
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12 col-lg-6 order-lg-2 text-center">
                        <!-- 50% C -->
                        <div class="time_indicator">1:23:45 of 5:43:21</div>
                        <div>
                            <button id="btnRewind" type="button" class="btn btn-outline-secondary btn-lg" aria-label="Rewind to Start">&#x23EE;</button>
                            <button type="button" class="btn btn-outline-secondary btn-lg" aria-label="Rewind to Selection Start / Previous Marker">&#x23EA;</button>
                            <button id="btnPlayPause" type="button" class="btn btn-outline-primary btn-lg" aria-label="Play / Pause">&#x25B6;</button>
                            <button type="button" class="btn btn-outline-secondary btn-lg" aria-label="Forward to Selection End / Next Marker">&#x23E9;</button>
                            <button id="btnForward" type="button" class="btn btn-outline-secondary btn-lg" aria-label="Forward to End">&#x23ED;</button>
                        </div>
                        <!-- <div>
                            <button id="audioFileBtn">&#x23CF;</button>
                            <input type="text" id="audioFileLbl" readonly>
                            <label for="audioFileInput" class="form-label">File:</label>
                            <input class="form-control" type="file" id="audioFileInput" accept="audio/*">
                            <audio id="audioElement" crossorigin="anonymous"></audio>
                        </div> -->

                        <div class="mb-3">
                            <label for="audioFileInput" class="form-label">File:</label>
                            <div class="input-group">
                                <input id="audioFileLbl" type="text" class="form-control" readonly>
                                <button class="btn btn-outline-secondary" type="button" id="audioFileBtn">&#x23CF;</button>
                            </div>
                            <input class="form-control" type="file" id="audioFileInput" accept="audio/*">
                            <audio id="audioElement" crossorigin="anonymous"></audio>
                        </div>
                    </div>

                    <!-- 25% L -->
                    <div class="col-12 col-lg-3 order-lg-1">
                        <!-- Volume control -->
                        <div class="mb-3">
                            <label for="rangeVolume" class="form-label">Volume</label>
                            <output for="rangeVolume" id="outputVolume" aria-hidden="true" class="form-text float-end">100</output>
                            <input type="range" class="form-range" min="0" max="100" step="1" value="100" id="rangeVolume">
                        </div>

                        <!-- Speed control -->
                        <div class="mb-3">
                            <label for="rangeSpeed" class="form-label">Playback speed</label>
                            <output for="rangeSpeed" id="outputSpeed" aria-hidden="true" class="form-text float-end">100</output>
                            <input type="range" class="form-range" min="25" max="125" step="5" value="100" id="rangeSpeed">
                        </div>

                        <a href="https://github.com/bbc/peaks.js/blob/master/doc/API.md" target="_blank" class="btn btn-info">&#x2754;</a>
                    </div>

                    <!-- 25% R -->
                    <div class="col-12 col-lg-3 order-lg-3">
                        <!-- Pitch control -->
                        <div class="mb-3">
                            <label for="rangePitch" class="form-label">Pitch</label>
                            <output for="rangePitch" id="outputPitch" aria-hidden="true" class="form-text float-end">0</output>
                            <input type="range" class="form-range" min="-12" max="12" step="1" value="0" id="rangePitch">
                        </div>

                        <div class="mb-3 text-center">
                            <label class="form-label float-start">Channel</label><br><br>
                            <div class="btn-group mb-2" role="group" aria-label="Channel selector">
                                <!-- Left -->
                                <input type="radio" class="btn-check" name="radioChannel" id="radioChannelL" autocomplete="off">
                                <label class="btn btn-outline-primary channel-selector" for="radioChannelL" title="Left">&#x25FC;&#x25FC;&#x25FB;</label>

                                <!-- Stereo -->
                                <input type="radio" class="btn-check" name="radioChannel" id="radioChannelS" autocomplete="off" checked>
                                <label class="btn btn-outline-primary channel-selector" for="radioChannelS" title="Stereo">&#x25FC;&#x25FC;&#x25FC;</label>

                                <!-- Right -->
                                <input type="radio" class="btn-check" name="radioChannel" id="radioChannelR" autocomplete="off">
                                <label class="btn btn-outline-primary channel-selector" for="radioChannelR" title="Right">&#x25FB;&#x25FC;&#x25FC;</label>
                            </div>
                            <br>
                            <div class="btn-group" role="group" aria-label="Channel selector">
                                <!-- Left only -->
                                <input type="radio" class="btn-check" name="radioChannel" id="radioChannelLO" autocomplete="off">
                                <label class="btn btn-outline-primary channel-selector" for="radioChannelLO" title="Far Left">&#x25FC;&#x25FB;&#x25FB;</label>

                                <!-- Center -->
                                <input type="radio" class="btn-check" name="radioChannel" id="radioChannelC" autocomplete="off">
                                <label class="btn btn-outline-primary channel-selector" for="radioChannelC" title="Center">&#x25FB;&#x25FC;&#x25FB;</label>

                                <!-- Right only -->
                                <input type="radio" class="btn-check" name="radioChannel" id="radioChannelRO" autocomplete="off">
                                <label class="btn btn-outline-primary channel-selector" for="radioChannelRO" title="Far Right">&#x25FB;&#x25FB;&#x25FC;</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div> <!-- .container-lg -->
        </div>



        <!-- Help > About -->
        <!-- <a class="dropdown-item" href="#" data-bs-toggle="modal" data-bs-target="#modalAbout">About</a> -->
        <div class="modal fade" id="modalAbout" tabindex="-1" aria-labelledby="modalAboutLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="modalAboutLabel">About</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p>Music Transcriber &amp; Trainer</p>
                        <p>v0.1</p>
                        <p><a href="https://www.github.com/karlis-i" target="_blank">https://www.github.com/karlis-i</a></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">OK</button>
                    </div>
                </div>
            </div>
        </div>


        <script
            src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"
        ></script>
        <script src="./node_modules/peaks.js/dist/peaks.min.js"></script>
        <!-- <script src="./node_modules/peaks.js/peaks.js"></script> -->
        <!-- @todo move .js files to project root dir later -->

        <!-- <script src="./renderer.js"></script> -->
<script>

// Volume
let volume = 100;
let volumeInput = null;
let volumeOutput = null;

// Speed
// Pitch

function setupRangeOutputs() {
    // Volume

    // assign DOM elements
    volumeInput = document.getElementById('rangeVolume');
    volumeOutput = document.getElementById('outputVolume');

    // display init value
    volumeOutput.textContent = volumeInput.value;

    // start listening
    volumeInput.addEventListener('input', function () {
        volume = this.value;
        volumeOutput.textContent = volume;
        audioElement.volume = volume / 100;
    });
}

let audioFileInput = null;
let audioFileBtn = null;
let audioFileLbl = null;
let audioElement = null;
let audioFile = null;

function setupAudioElements() {

    audioFileInput = document.getElementById('audioFileInput');
    audioFileBtn = document.getElementById('audioFileBtn');
    audioFileLbl = document.getElementById('audioFileLbl');
    audioElement = document.getElementById('audioElement');

    // use button instead of file input
    audioFileBtn.addEventListener('click', function(e){
        if (audioFileInput) {
            audioFileInput.click();
        }
    });

    // when audio loaded
    audioFileInput.addEventListener('change', function(){

        // get file
        audioFile = audioFileInput.files[0];

        // display filename
        audioFileLbl.value = audioFile.name;

        // load file in audio element
        audioElement.src = URL.createObjectURL(audioFile);
        audioElement.controls = true;

        drawWaveForm();

        // remove focus from file input
        audioFileInput.blur();
    });
}

let btnPlayPause = null;
let btnRewind = null;
let btnForward = null;
let playing = false;

function setupTransport() {
    btnPlayPause = document.getElementById("btnPlayPause");
    btnRewind = document.getElementById("btnRewind");
    btnForward = document.getElementById("btnForward");

    const playString = "&#x25B6;";
    const pauseString = "&#x23F8;";

    // play/pause
    btnPlayPause.addEventListener("click", function (){
        if (audioElement.currentSrc) {
            if (audioElement.paused) {
                audioElement.play();
                btnPlayPause.innerHTML = pauseString;
                btnPlayPause.classList.remove("btn-outline-primary");
                btnPlayPause.classList.add("btn-success");
            } else {
                audioElement.pause();
                btnPlayPause.innerHTML = playString;
                btnPlayPause.classList.remove("btn-success");
                btnPlayPause.classList.add("btn-outline-primary");
            }
            playing = !playing;
        }
    });

    // rewind
    btnRewind.addEventListener("click", function(){
        audioElement.currentTime = 0;
    });

    // forward
    btnForward.addEventListener("click", function(){
        audioElement.currentTime += 5;
    });
}

function drawWaveForm() {
    const audioContext = new AudioContext();

    (function (Peaks) {
        const options = {
            zoomview: {
                container: document.getElementById('zoomview-container')
            },
            overview: {
                container: document.getElementById('overview-container')
            },
            scrollbar: {
                container: document.getElementById('scrollbar-container'),
                color: '#888',
                minWidth: 100
            },
            showPlayheadTime: true,
            mediaElement: audioElement,
            webAudio: {
                audioContext: audioContext,
                scale: 128,
                multiChannel: false
            }
        };

        Peaks.init(options, function (err, peaks) {
            if (err) {
                console.error(`Failed to initialize Peaks instance: ${err.message}`);
                return;
            }

            // Do something when the waveform is displayed and ready
        });
    })(peaks);
}

function setupSpacebarControl() {
    // spacebar controls playback
    document.addEventListener("keydown", function(e){
        if (e.code === "Space") {
            e.preventDefault();
            btnPlayPause.click();
        }
    });
}

document.addEventListener("DOMContentLoaded", function () {
    setupRangeOutputs();
    setupAudioElements();
    setupTransport();
    setupSpacebarControl();
});

</script>
    </body>
</html>
